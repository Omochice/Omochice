name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  check-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # gitleaks scans the commit history, so a shallow clone is not enough
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --print-build-logs
      - run: nix develop -c prek run --all-files --hook-stage pre-push
  status-check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - check-code
    permissions: {}
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
