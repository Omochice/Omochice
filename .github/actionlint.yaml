paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # zizmor's self-repository audit requires `uses: $/...`, but actionlint 1.7.12 cannot parse it yet.
      # Remove this once https://github.com/rhysd/actionlint/issues/711 is resolved.
      - 'specifying action "\$/[^"]+" in invalid format because ref is missing'
